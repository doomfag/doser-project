name: Aplicativos instaláveis
on:
  workflow_dispatch:
  push:
    branches: [codex/doser-download]
    paths:
      - "desktop/**"
      - "server/**"
      - "src/**"
      - "data/clinical/**"
      - "downloads/Doser.html"
      - "scripts/prepare-native.ts"
      - "scripts/android.ts"
      - "package*.json"
      - "electron-builder.yml"
      - "capacitor.config.json"
      - ".github/workflows/native.yml"
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            args: --win nsis --x64
          - os: macos-15
            target: macOS
            args: --mac dmg
          - os: ubuntu-24.04
            target: Linux
            args: --linux deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run native:prepare
      - run: npm run test:desktop
        if: runner.os == 'Windows' || runner.os == 'macOS'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Doser-${{ matrix.target }}
          path: |
            native-releases/*.exe
            native-releases/*.deb
            native-releases/*.dmg
          if-no-files-found: error
          retention-days: 3
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar SDK Android
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:prepare
        env:
          DOSER_ANDROID_PREVIEW: "true"
      - run: chmod +x android/gradlew
      - name: Compilar APK
        working-directory: android
        run: |
          if ./gradlew assembleDebug --no-daemon > build.log 2>&1; then
            cat build.log
          else
            echo '### Falha na compilação Android' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Conferir instalação Android separada
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$sdk_dir/build-tools/36.0.0/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > android-badging.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('android-badging.txt').read_text()
          assert "package: name='io.github.doomfag.doser.preview07'" in text
          assert "versionCode='7'" in text
          assert "versionName='0.7.0'" in text
          print('Prévia Android confirmada: pacote separado da versão anterior.')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Doser-Android-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Downloads da versão
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Publicar instaladores de teste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files
          find release-input -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} release-files/ \;
          cp release-input/Doser-Android-APK-teste/app-debug.apk release-files/Doser-Android-PREVIA-SEPARADA-0.7.apk
          cp docs/melhorias-0.7.md release-files/LEIA-ME.md
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cd ..
          tag="v0.7.0-desktop-android-preview"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Doser 0.7 — PC e prévia Android" --notes-file docs/melhorias-0.7.md
          fi
          gh release upload "$tag" release-files/* --clobber
