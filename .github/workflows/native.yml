name: Aplicativos instaláveis
on:
  workflow_dispatch:
  push:
    branches: [codex/doser-download]
    paths:
      - "desktop/**"
      - "server/**"
      - "src/**"
      - "scripts/prepare-native.ts"
      - "scripts/android.ts"
      - "package*.json"
      - "electron-builder.yml"
      - "capacitor.config.json"
      - ".github/workflows/native.yml"
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            args: --win nsis --x64
          - os: ubuntu-24.04
            target: Linux
            args: --linux deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run native:prepare
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Doser-${{ matrix.target }}
          path: |
            native-releases/*.exe
            native-releases/*.deb
          if-no-files-found: error
          retention-days: 14
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar SDK Android
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:prepare
      - run: chmod +x android/gradlew
      - name: Compilar APK
        working-directory: android
        run: |
          if ./gradlew assembleDebug --no-daemon > build.log 2>&1; then
            cat build.log
          else
            echo '### Falha na compilação Android' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Doser-Android-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
