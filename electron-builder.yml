appId: io.github.doomfag.doser
productName: Doser
asar: true
electronDist: node_modules/electron/dist
directories:
  output: native-releases
files:
  - desktop/main.cjs
  - desktop/icon.png
  - build-native/**/*
  - dist/**/*
  - data/clinical/curated.json
  - package.json
  - "!node_modules/**/*"
win:
  icon: desktop/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: Doser-${version}-Windows-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  syncDesktopName: true
  icon: desktop/icon.png
  target: [deb]
  category: Education
  maintainer: Doser
  artifactName: Doser-${version}-Linux-amd64.${ext}

mac:
  target: dmg
  icon: desktop/icon.png
  category: public.app-category.reference
  artifactName: Doser-${version}-macOS-${arch}.${ext}
